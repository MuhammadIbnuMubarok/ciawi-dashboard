name: telegram-update
on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      cuaca:
        description: "Cuaca (opsional, mis. Mendung)"
        required: false
        default: "-"
jobs:
  kirim:
    runs-on: ubuntu-latest
    steps:
      - name: Kirim update real-time dua mata Ciawi
        env:
          CUACA: ${{ github.event.inputs.cuaca || '-' }}
        run: |
          curl -m 150 -s "https://ciawi-dashboard.vercel.app/api/telegram?cuaca=${CUACA}"